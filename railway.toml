[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npx prisma migrate resolve --rolled-back 20260509010000_crm_campaign_v2 || true && npx prisma migrate resolve --rolled-back 20260426040000_add_portion_isavailable_option_groups || true && npx prisma migrate resolve --rolled-back 20260518000001_add_distance_min_fee_km || true && npx prisma migrate deploy && npx next start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
