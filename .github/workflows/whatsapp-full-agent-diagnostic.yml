# ─────────────────────────────────────────────────────────────────────────────
# WhatsApp Full Agent Diagnostic — one consolidated battery across BOTH paths
# (Text Order + Receptionist) and both phone profiles (allowlisted self-test +
# synthetic non-allowlisted). Emits PASS/WARNING/FAIL + operational
# recommendation. Read-only: never sends WhatsApp, never creates order/Pix,
# never changes config. Fails the job on p0>0 or any safety violation.
# Uses CRON_SECRET.
# ─────────────────────────────────────────────────────────────────────────────

name: WhatsApp Full Agent Diagnostic

on:
  workflow_dispatch:
    inputs:
      restaurant_slug:
        description: "Restaurant slug"
        required: true
        default: "sushi-cazza"
      non_allowlisted_phone:
        description: "Telefone sintético FORA da allowlist (nunca logado em claro)"
        required: false
        default: "+5511900000000"
      field_validated:
        description: "true SÓ se houver teste de campo controlado + rollback documentados"
        required: false
        default: "false"

jobs:
  full-agent:
    name: "Full Agent Diagnostic (read-only)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build URL
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="${{ secrets.QUALITY_AUDIT_URL }}"; fi
          BASE_URL="${BASE_URL%/}"
          echo "url=${BASE_URL}/api/cron/whatsapp/full-agent-diagnostic" >> "$GITHUB_OUTPUT"

      - name: "Run full agent diagnostic"
        env:
          URL: ${{ steps.params.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SLUG: ${{ inputs.restaurant_slug }}
          OUT_PHONE: ${{ inputs.non_allowlisted_phone }}
          FIELD: ${{ inputs.field_validated }}
        run: |
          set -e
          BODY=$(jq -nc --arg slug "$SLUG" --arg phone "$OUT_PHONE" --argjson field "${FIELD:-false}" \
            '{restaurantSlug:$slug, nonAllowlistedPhone:$phone, fieldValidated:$field}')
          curl --connect-timeout 20 --max-time 150 -sS -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d "$BODY" -o /tmp/r.json -w "%{http_code}" > /tmp/code.txt || true
          HTTP=$(cat /tmp/code.txt)
          echo "← HTTP            : $HTTP"
          echo "← status          : $(jq -r '.summary.status' /tmp/r.json)"
          echo "← p0/p1/p2        : $(jq -r '.summary.p0' /tmp/r.json)/$(jq -r '.summary.p1' /tmp/r.json)/$(jq -r '.summary.p2' /tmp/r.json)"
          echo "← recommendation  : $(jq -r '.summary.recommendation' /tmp/r.json)"
          echo "← safety          : noEvolution=$(jq -r '.safety.noEvolution' /tmp/r.json) noRealOrder=$(jq -r '.safety.noRealOrder' /tmp/r.json) noRealPix=$(jq -r '.safety.noRealPix' /tmp/r.json) runtimeTouched=$(jq -r '.safety.runtimeTouched' /tmp/r.json)"
          echo "── cenários ──"
          jq -r '.scenarios[] | "  [\(.severity)] \(.id) \(.phoneProfile) host=\(.host) type=\(.responseType // "—") \(if .passed then "OK" else "FAIL: \(.failures | join("; "))" end)"' /tmp/r.json
          echo "── notes ──"; jq -r '.notes[]?' /tmp/r.json

          if [[ "$HTTP" -lt 200 || "$HTTP" -ge 300 ]]; then echo "::error::non-2xx ($HTTP)"; exit 1; fi
          P0=$(jq -r '.summary.p0' /tmp/r.json)
          NE=$(jq -r '.safety.noEvolution' /tmp/r.json); NO=$(jq -r '.safety.noRealOrder' /tmp/r.json)
          NP=$(jq -r '.safety.noRealPix' /tmp/r.json);   RT=$(jq -r '.safety.runtimeTouched' /tmp/r.json)
          if [[ "$P0" != "0" ]]; then echo "::error::p0=$P0 (>0)"; exit 1; fi
          if [[ "$NE" != "true" || "$NO" != "true" || "$NP" != "true" || "$RT" != "false" ]]; then echo "::error::safety violada"; exit 1; fi
          echo "✅ Full Agent Diagnostic concluído — read-only, telefones mascarados."
