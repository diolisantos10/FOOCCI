# ─────────────────────────────────────────────────────────────────────────────
# Waiter Training — regenerate OLD pending proposals via the Agent Reasoning Layer
#
# Re-reasons PENDING_REVIEW / BACKLOG proposals (never APPROVED / REJECTED) so old
# wrong classifications (e.g. "Aceita Alelo Refeição?" → INDECISIVE) are fixed.
# DEFAULTS TO DRY-RUN; a real run requires dry_run=false. Manual only.
# Uses CRON_SECRET — NOT ADMIN_SECRET. Never sends, never touches the runtime.
# ─────────────────────────────────────────────────────────────────────────────

name: Waiter Training Regenerate Suggestions

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run? (true = preview, false = actually rewrite proposals)"
        type: choice
        default: "true"
        options: ["true", "false"]
      limit:
        description: "Max proposals to scan"
        type: string
        default: "200"
      use_llm:
        description: "Use LLM reasoning? (false = deterministic guardrails)"
        type: choice
        default: "false"
        options: ["false", "true"]

jobs:
  regenerate:
    name: "Regenerate Training Suggestions"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Build URL
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="${{ secrets.QUALITY_AUDIT_URL }}"; fi
          BASE_URL="${BASE_URL%/}"
          echo "regen=${BASE_URL}/api/cron/waiter/training/regenerate-suggestions" >> "$GITHUB_OUTPUT"

      - name: "Regenerate (DRY-RUN unless dry_run=false)"
        env:
          URL: ${{ steps.params.outputs.regen }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
          USE_LLM: ${{ inputs.use_llm }}
        run: |
          BODY=$(jq -nc \
            --argjson dry "$([[ "$DRY_RUN" == "false" ]] && echo false || echo true)" \
            --argjson llm "$([[ "$USE_LLM" == "true" ]] && echo true || echo false)" \
            --argjson lim "${LIMIT:-200}" \
            '{dryRun:$dry, useLLM:$llm, limit:$lim, status:["PENDING_REVIEW","BACKLOG"]}')
          echo "→ payload: $BODY"
          set +e
          curl --connect-timeout 20 --max-time 300 -sS -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d "$BODY" \
            -o /tmp/regen.json -w "%{http_code}" > /tmp/rcode.txt
          set -e
          HTTP=$(cat /tmp/rcode.txt)
          STATUS=$(jq -r '.status' /tmp/regen.json 2>/dev/null)
          RUNTIME_TOUCHED=$(jq -r '.runtimeTouched' /tmp/regen.json 2>/dev/null)
          echo "← HTTP                       : $HTTP"
          echo "← status                     : $STATUS"
          echo "← dryRun                     : $(jq -r '.dryRun' /tmp/regen.json 2>/dev/null)"
          echo "← found                      : $(jq -r '.found // 0' /tmp/regen.json 2>/dev/null)"
          echo "← wouldRegenerate            : $(jq -r '.wouldRegenerate // 0' /tmp/regen.json 2>/dev/null)"
          echo "← regenerated                : $(jq -r '.regenerated // 0' /tmp/regen.json 2>/dev/null)"
          echo "← protectedApprovedRejected  : $(jq -r '.protectedApprovedRejected // 0' /tmp/regen.json 2>/dev/null)"
          echo "← intentChanged              : $(jq -r '.intentChanged // 0' /tmp/regen.json 2>/dev/null)"
          echo "← coherencePass              : $(jq -r '.coherencePass // 0' /tmp/regen.json 2>/dev/null)"
          echo "← coherenceNeedsReviewOrHigh : $(jq -r '.coherenceNeedsReviewOrHigh // 0' /tmp/regen.json 2>/dev/null)"
          echo "← reasoningMode              : $(jq -rc '.reasoningMode // {}' /tmp/regen.json 2>/dev/null)"
          echo "← runtimeTouched             : $RUNTIME_TOUCHED"
          echo "── mudanças de intenção (amostra) ──"
          jq -r '.intentChangeSamples[]? | "\(.fromIntent) → \(.toIntent) · \(.title)"' /tmp/regen.json 2>/dev/null || true
          if [[ "$HTTP" -lt 200 || "$HTTP" -ge 300 ]]; then echo "::error::regenerate non-2xx ($HTTP)."; exit 1; fi
          if [[ "$STATUS" != "PASS" ]]; then echo "::error::regenerate status=$STATUS"; exit 1; fi
          if [[ "$RUNTIME_TOUCHED" != "false" ]]; then echo "::error::runtimeTouched must be false"; exit 1; fi
          echo "✅ Regeneração ($([[ "$DRY_RUN" == "false" ]] && echo REAL || echo dry-run)) concluída — APPROVED/REJECTED preservados, runtime intocado."
