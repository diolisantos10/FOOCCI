# ─────────────────────────────────────────────────────────────────────────────
# Agent Library — Auto-Extraction Diagnostic (manual)
#
# Proves, in production and with zero manual steps, that the Waiter Agent Library
# extracts techniques AUTOMATICALLY on upload. It POSTs to the admin diagnostic
# route, which creates a synthetic source, runs the real extraction, validates,
# and DELETES the temp source — leaving nothing behind. Never touches runtime.
#
# Manual only (workflow_dispatch) — NOT scheduled.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
#   FOOCCI_BASE_URL   Production URL with no trailing slash (same as other crons).
#   ADMIN_SECRET      Must match the ADMIN_SECRET env var set in Railway.
#                     Sent as the `x-admin-secret` header; never printed.
# ─────────────────────────────────────────────────────────────────────────────

name: Agent Library Auto-Extraction Diagnostic

on:
  workflow_dispatch: {}

jobs:
  run-diagnostic:
    name: "Waiter Library Auto-Extraction"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Build endpoint URL
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="${{ secrets.QUALITY_AUDIT_URL }}"; fi
          BASE_URL="${BASE_URL%/}"   # strip any trailing slash
          echo "url=${BASE_URL}/api/admin/diagnostics/agent-library/auto-extraction-test" >> "$GITHUB_OUTPUT"

      # ADMIN_SECRET is injected via env: so it never appears in the step
      # definition or in workflow logs (GitHub masks it automatically).
      - name: "POST auto-extraction-test"
        env:
          ENDPOINT_URL: ${{ steps.params.outputs.url }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          echo "────────────────────────────────────"
          echo "→ Endpoint : $ENDPOINT_URL"
          echo "────────────────────────────────────"

          set +e
          curl --connect-timeout 20 --max-time 180 -sS \
            -X POST "$ENDPOINT_URL" \
            -H "x-admin-secret: $ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -o /tmp/response.json \
            -w "%{http_code}" > /tmp/http_status.txt
          CURL_EXIT=$?
          set -e

          HTTP_STATUS=$(cat /tmp/http_status.txt 2>/dev/null || echo "000")

          # Print ONLY safe summary fields — never rawText / technique content / secret.
          STATUS=$(jq -r '.status // "?"'            /tmp/response.json 2>/dev/null)
          TECHS=$(jq  -r '.techniquesCreated // "?"' /tmp/response.json 2>/dev/null)
          CLEANED=$(jq -r '.sourceCleanedUp // "?"'  /tmp/response.json 2>/dev/null)
          RUNTIME=$(jq -r '.runtimeTouched // "?"'   /tmp/response.json 2>/dev/null)
          MESSAGE=$(jq -r '.message // ""'           /tmp/response.json 2>/dev/null)

          echo "← curl exit        : $CURL_EXIT"
          echo "← HTTP Status      : $HTTP_STATUS"
          echo "← status           : $STATUS"
          echo "← techniquesCreated: $TECHS"
          echo "← sourceCleanedUp  : $CLEANED"
          echo "← runtimeTouched   : $RUNTIME"
          echo "← message          : $MESSAGE"

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::curl failed with exit $CURL_EXIT (connection/timeout error)."
            exit "$CURL_EXIT"
          fi

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::Endpoint returned non-2xx status ($HTTP_STATUS)."
            exit 1
          fi

          # Assert the diagnostic PASSED with the required shape.
          if [[ "$STATUS" != "PASS" ]]; then
            echo "::error::Diagnostic status is '$STATUS' (expected PASS). message: $MESSAGE"
            exit 1
          fi
          if ! [[ "$TECHS" =~ ^[0-9]+$ ]] || [[ "$TECHS" -lt 1 ]]; then
            echo "::error::techniquesCreated='$TECHS' (expected > 0)."
            exit 1
          fi
          if [[ "$CLEANED" != "true" ]]; then
            echo "::error::sourceCleanedUp='$CLEANED' (expected true)."
            exit 1
          fi
          if [[ "$RUNTIME" != "false" ]]; then
            echo "::error::runtimeTouched='$RUNTIME' (expected false)."
            exit 1
          fi

          echo "✅ Auto-extraction diagnostic PASS — $TECHS técnicas, fonte limpa, runtime intocado."
