# ─────────────────────────────────────────────────────────────────────────────
# CRM — archive/cancel a campaign (cron-safe, manual)
#
# Takes a campaign OUT of operation by setting status=CANCELLED. Never deletes,
# never sends, never sets an active/sending status. DEFAULTS TO DRY-RUN; a real
# change requires explicitly dispatching dry_run=false.
#
# Manual only (workflow_dispatch). Uses CRON_SECRET — NOT ADMIN_SECRET.
# ─────────────────────────────────────────────────────────────────────────────

name: CRM Archive Campaign

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run? (true = preview, false = actually set CANCELLED)"
        type: choice
        default: "true"
        options: ["true", "false"]
      campaign_id:
        description: "Campaign id to take out of operation"
        type: string
        default: "cmq1r7i1b00o2s6xju850qkp5"

jobs:
  archive:
    name: "CRM Archive Campaign"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build URL
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="${{ secrets.QUALITY_AUDIT_URL }}"; fi
          BASE_URL="${BASE_URL%/}"
          echo "archive=${BASE_URL}/api/cron/crm/archive-campaign" >> "$GITHUB_OUTPUT"

      - name: "Archive campaign (DRY-RUN unless dry_run=false)"
        env:
          URL: ${{ steps.params.outputs.archive }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          BODY=$(jq -nc --argjson dry "$([[ "$DRY_RUN" == "false" ]] && echo false || echo true)" \
                       --arg cid "$CAMPAIGN_ID" '{dryRun:$dry, campaignId:$cid}')
          echo "→ payload: $BODY"
          set +e
          curl --connect-timeout 20 --max-time 180 -sS -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d "$BODY" \
            -o /tmp/archive.json -w "%{http_code}" > /tmp/acode.txt
          set -e
          HTTP=$(cat /tmp/acode.txt)
          echo "← HTTP            : $HTTP"
          echo "← ok              : $(jq -r '.ok' /tmp/archive.json 2>/dev/null)"
          echo "← dryRun          : $(jq -r '.dryRun' /tmp/archive.json 2>/dev/null)"
          echo "← campaignId      : $(jq -r '.campaignId // "?"' /tmp/archive.json 2>/dev/null)"
          echo "← name            : $(jq -r '.name // "?"' /tmp/archive.json 2>/dev/null)"
          echo "← previousStatus  : $(jq -r '.previousStatus // "?"' /tmp/archive.json 2>/dev/null)"
          echo "← targetStatus    : $(jq -r '.targetStatus // "?"' /tmp/archive.json 2>/dev/null)"
          echo "← changed         : $(jq -r '.changed' /tmp/archive.json 2>/dev/null)"
          echo "← alreadyArchived : $(jq -r '.alreadyArchived' /tmp/archive.json 2>/dev/null)"
          echo "← note            : $(jq -r '.note // ""' /tmp/archive.json 2>/dev/null)"
          if [[ "$HTTP" -lt 200 || "$HTTP" -ge 300 ]]; then echo "::error::archive non-2xx ($HTTP)."; exit 1; fi
          echo "✅ Archive ($([[ "$DRY_RUN" == "false" ]] && echo REAL || echo dry-run)) concluído — nada enviado."
