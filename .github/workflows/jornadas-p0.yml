name: Jornadas do P0 — ponta a ponta contra Postgres

on:
  pull_request:
    paths:
      - "src/services/salaDeVendas/prospeccao/**"
      - "src/services/salaDeVendas/abordar.ts"
      - "src/services/foocci-sdr/LeadContactSafety.ts"
      - "src/services/foocci-sdr/modelosLiberados.ts"
      - "src/services/foocci-sdr/padraoModelosRecentes.ts"
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
      - "scripts/jornada-prospeccao.test.ts"
      - "scripts/jornada-entradas.test.ts"
      - "scripts/jornada-enriquecimento.test.ts"
      - "scripts/jornada-base-fria-ampliada.test.ts"
      - "scripts/jornada-retentativa-prospeccao.test.ts"
      - "src/services/salaDeVendas/supervisora/adequacaoDoTemplate.ts"
      - "src/services/salaDeVendas/supervisora/segundoPlano.ts"
      - "scripts/jornada-supervisora-abordagem.test.ts"
      - "src/services/site/SiteLeadService.ts"
      - "src/services/foocci-sdr/FoocciSalesInbound.ts"
      - "vitest.jornada.config.ts"
      - ".github/workflows/jornadas-p0.yml"
  workflow_dispatch:

concurrency:
  group: jornadas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jornada:
    name: Jornadas contra Postgres real
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foocci_jornada
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foocci_jornada
      FOOCCI_SDR_SEND_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Criar o esquema a partir do schema.prisma
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: ⭐ Provar as migrations NOVAS sobre um banco realista
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c '
            DROP TABLE IF EXISTS "itens_de_prospeccao" CASCADE;
            DROP TABLE IF EXISTS "lotes_de_prospeccao" CASCADE;
            DROP TABLE IF EXISTS "prospeccao_config" CASCADE;
            DROP TABLE IF EXISTS "modelos_de_vendas_envio" CASCADE;
            DROP TYPE  IF EXISTS "SituacaoDoItem";
            DROP TYPE  IF EXISTS "SituacaoDoLote";
          '
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260905039000_origens_multicanal/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260905040000_prospeccao_e_origens_multicanal/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260908203000_quem_liberou_o_lote/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260908205500_liberado_por_internal_user/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260910120000_waba_da_sala_persistido/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260910153000_reserva_da_rodada_automatica/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260910180000_base_continua_memoria_e_trava/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260910210000_backfill_importacoes_legadas/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260911120000_base_fria_campos_completos/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260914100000_modelos_de_vendas_envio/migration.sql
          echo "✅ As migrations da prospecção e da seleção de templates aplicaram sobre banco realista."

      - name: Percorrer as Jornadas 1, 2 e 3
        run: npm run test:jornada
