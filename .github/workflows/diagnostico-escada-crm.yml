name: Diagnóstico — escada do Agente de CRM em produção

# Somente leitura. Responde "o tempo em SHADOW_ONLY produziu evidência ou
# silêncio?" consultando as rotas de leitura que já existem em produção, com o
# ADMIN_SECRET lido do Railway dentro do runner. O segredo nunca é impresso;
# nenhuma mensagem de sombra é impressa (o log deste repositório é público).
#
# Este workflow NÃO promove nada — a promoção na escada é ato humano.

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Quantos restaurantes examinar (0 = todos)'
        required: false
        default: '12'
  push:
    paths:
      - 'scripts/diagnostico-escada-crm.mjs'
      - '.github/workflows/diagnostico-escada-crm.yml'

jobs:
  diagnosticar:
    name: Perguntar à produção
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar diagnóstico da escada
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          LIMITE_RESTAURANTES: ${{ github.event.inputs.limite || '12' }}
        run: node scripts/diagnostico-escada-crm.mjs
