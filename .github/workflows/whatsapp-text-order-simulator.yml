# ─────────────────────────────────────────────────────────────────────────────
# WhatsApp Text Order — SIMULATOR (hermetic full-journey proof, manual)
#
# Runs the self-contained simulator (synthetic catalog/payment/address) over the
# canonical scenarios and proves PASS/p0=0 with no Evolution / no real order /
# no real Pix / runtimeTouched=false. Lets the team prove the architecture in
# production WITHOUT a phone. Manual only. Uses CRON_SECRET — NOT ADMIN_SECRET.
# ─────────────────────────────────────────────────────────────────────────────

name: WhatsApp Text Order Simulator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Simulated mode"
        required: false
        default: "REPLY_ONLY"
        type: choice
        options: [DRY_RUN, REPLY_ONLY, FULL_TEST]

jobs:
  simulator:
    name: "Text Order Simulator"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build URL
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="${{ secrets.QUALITY_AUDIT_URL }}"; fi
          BASE_URL="${BASE_URL%/}"
          echo "url=${BASE_URL}/api/cron/whatsapp/text-order-simulator" >> "$GITHUB_OUTPUT"

      - name: "Run simulator"
        env:
          URL: ${{ steps.params.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ inputs.mode }}
        run: |
          BODY=$(jq -nc --arg mode "$MODE" '{mode: $mode}')
          set +e
          curl --connect-timeout 20 --max-time 150 -sS -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d "$BODY" -o /tmp/sim.json -w "%{http_code}" > /tmp/code.txt
          set -e
          HTTP=$(cat /tmp/code.txt)
          STATUS=$(jq -r '.status' /tmp/sim.json 2>/dev/null)
          RUNTIME_TOUCHED=$(jq -r '.runtimeTouched' /tmp/sim.json 2>/dev/null)
          echo "← HTTP                  : $HTTP"
          echo "← status                : $STATUS"
          echo "← passed/warn/fail/total: $(jq -r '.passed' /tmp/sim.json)/$(jq -r '.warned' /tmp/sim.json)/$(jq -r '.failed' /tmp/sim.json)/$(jq -r '.total' /tmp/sim.json)"
          echo "← p0                    : $(jq -r '.p0' /tmp/sim.json)"
          echo "← safety                : noEvolution=$(jq -r '.safety.noEvolution' /tmp/sim.json) noRealOrder=$(jq -r '.safety.noRealOrder' /tmp/sim.json) noRealPix=$(jq -r '.safety.noRealPix' /tmp/sim.json)"
          echo "── cenários ──"
          jq -r '.scenarios[]? | "\(if .status=="PASS" then "✓" elif .status=="WARNING" then "⚠" else "✗" end) \(.scenarioId) — ações: \(.actions | join(",") // "—")"' /tmp/sim.json 2>/dev/null || true
          echo "← runtimeTouched        : $RUNTIME_TOUCHED"
          if [[ "$HTTP" -lt 200 || "$HTTP" -ge 300 ]]; then echo "::error::simulator non-2xx ($HTTP)."; exit 1; fi
          if [[ "$STATUS" == "FAIL" ]]; then echo "::error::simulator status=FAIL"; exit 1; fi
          if [[ "$RUNTIME_TOUCHED" != "false" ]]; then echo "::error::runtimeTouched must be false"; exit 1; fi
          echo "✅ Simulador: $STATUS — nada enviado, nenhum pedido/Pix real criado."
