# ─────────────────────────────────────────────────────────────────────────────
# CRM Cron — Foocci recurring campaigns + automations dispatcher
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
#   FOOCCI_BASE_URL   Production URL with no trailing slash.
#                     Example: https://foocci-production.up.railway.app
#
#   CRON_SECRET       Must match the CRON_SECRET env var set in Railway.
#                     Never printed in logs — injected via env:, not ${{ }}.
#
# Scheduled triggers (both disabled by default until secrets are configured):
#
#   Campaigns   — every 15 minutes           cron: "*/15 * * * *"
#   Automations — 11:00 UTC = 08:00 Brasília cron: "0 11 * * *"
#
# Why GitHub Actions instead of Railway native cron:
#   Railway's cron plugin sends plain GET requests with no custom headers.
#   Both CRM endpoints require  Authorization: Bearer {CRON_SECRET}.
# ─────────────────────────────────────────────────────────────────────────────

name: CRM Cron

# ── HISTÓRICO: 23/08/2026, desligado de manhã e RELIGADO à noite ────────────
# Os horários */15 e */5 ficaram algumas horas desligados porque o Actions deste
# repositório estava travado por um ORÇAMENTO DE PRODUTO zerado ("Budgets and
# alerts" → Actions: $0 budget, Stop usage: Yes). Não era pagamento recusado nem
# o antigo "spending limit". Com $0 o job morria em ~2 s, sem máquina alocada e
# sem log: os dois horários não chamavam o endpoint nenhuma vez, só geravam
# e-mail de falha (85 por dia só deste arquivo).
#
# O CEO ajustou o orçamento para US$ 20 e a condição de religar foi CONFERIDA,
# não presumida: rodada de 266 s, máquina "GitHub Actions 1000008708", 10 passos
# executados e log existente. Os três horários voltaram no mesmo ato.
#
# Fica registrado, porque continua valendo: os jobs run-campaigns e
# send-cart-recovery são RESERVA. O motor primário está DENTRO do aplicativo,
# ligado no boot por src/instrumentation.ts —
#   • run-campaigns (*/15)      → ScheduledCampaignScheduler, tique de 10 min
#   • send-cart-recovery (*/5)  → CartRecoveryScheduler,      tique de 1 min
# Rodar os dois em paralelo não duplica envio: ambos chamam o MESMO runner
# idempotente e as travas são de banco, não de combinação (carrinho:
# recoveryAttempts=0 + lastRecoveryAt de 24 h, máx. 1 por rascunho e 1 por
# cliente/dia; campanhas: dedupe por cliente + recuperação de SENDING travado).
#
# run-automations ("0 11 * * *") nunca foi desligado: é o único caminho que
# existe para REACTIVATION / BIRTHDAY / POST_ORDER + reclassify-tiers, não há
# motor em processo para ele. Se um dia o Actions travar de novo, ESTE é o que
# deve continuar de pé — a falha dele é informação, não ruído.
# ────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Job: run-campaigns  — every 15 minutes, 24 h / 7 d
    - cron: "*/15 * * * *"
    # Job: run-automations — daily at 11:00 UTC = 08:00 America/Sao_Paulo
    - cron: "0 11 * * *"
    # Job: send-cart-recovery — every 5 minutes (GitHub Actions minimum; for
    # true 1-min frequency configure a Railway cron job in the dashboard)
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      target:
        description: "Which cron to call"
        required: true
        default: campaigns
        type: choice
        options:
          - campaigns
          - automations
          - both
          - cart-recovery

      dry_run:
        description: "Dry run — preview only, no messages sent (campaigns / automations)"
        required: false
        default: true
        type: boolean

      cart_recovery_dry_run:
        description: "Cart Recovery — dry-run mode? (true = preview only, false = send WhatsApp)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      campaign_id:
        description: "Scope to one campaign ID (campaigns only, optional)"
        required: false
        type: string

      restaurant_id:
        description: "Scope to one restaurant ID (optional)"
        required: false
        type: string

      limit:
        description: "Max recipients per batch, 1–200 (campaigns only, default 5 for scheduled)"
        required: false
        default: "5"
        type: string

jobs:
  # ── Job 1: Scheduled Campaigns ───────────────────────────────────────────────
  #
  # Fires on the */15 schedule or when workflow_dispatch targets campaigns/both.
  # Scheduled runs: dryRun=false, limit=5 (keeps the request well within timeout).
  # Manual runs:    honour all inputs.
  # ─────────────────────────────────────────────────────────────────────────────
  run-campaigns:
    name: "Scheduled Campaigns"
    runs-on: ubuntu-latest
    # Tick novo cancela o anterior encalhado na fila. Dois efeitos: o run
    # conclui como `cancelled` (e o GitHub NAO manda e-mail de cancelamento,
    # so de falha), e some o zumbi de 90 minutos — um tick liberado tarde
    # dispararia um lote velho em cima de cliente real.
    concurrency:
      group: crm-cron-run-campaigns
      cancel-in-progress: true
    timeout-minutes: 10
    if: >-
      github.event.schedule == '*/15 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'campaigns' || inputs.target == 'both'))

    steps:
      # Build the full URL and JSON body before touching any secrets.
      - name: Build request parameters
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          BASE_URL="${BASE_URL%/}"   # strip any trailing slash
          echo "url=${BASE_URL}/api/cron/run-scheduled-campaigns" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Scheduled run: always live. The runner enforces the real per-provider
            # caps (Meta: 40/run — o teto antigo de 5/run era do provedor aposentado
            # with 1-2 s pacing) — this limit is just an upper-bound guard.
            echo 'body={"dryRun":false,"limit":40}' >> "$GITHUB_OUTPUT"
            echo "dry_run=false"                    >> "$GITHUB_OUTPUT"
          else
            # Manual dispatch: honour inputs
            DRY_RUN="${{ inputs.dry_run }}"
            BODY="{\"dryRun\":${DRY_RUN}"

            [[ -n "${{ inputs.campaign_id }}" ]] \
              && BODY="${BODY},\"campaignId\":\"${{ inputs.campaign_id }}\""

            [[ -n "${{ inputs.restaurant_id }}" ]] \
              && BODY="${BODY},\"restaurantId\":\"${{ inputs.restaurant_id }}\""

            LIMIT="${{ inputs.limit }}"
            [[ -n "$LIMIT" ]] \
              && BODY="${BODY},\"limit\":${LIMIT}"

            BODY="${BODY}}"
            echo "body=${BODY}"       >> "$GITHUB_OUTPUT"
            echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          fi

      # CRON_SECRET is injected via env: so it never appears in the step
      # definition or in workflow logs (GitHub masks it automatically).
      - name: "POST /api/cron/run-scheduled-campaigns"
        env:
          ENDPOINT_URL: ${{ steps.params.outputs.url }}
          REQUEST_BODY: ${{ steps.params.outputs.body }}
          CRON_SECRET:  ${{ secrets.CRON_SECRET }}
        run: |
          echo "────────────────────────────────────"
          echo "→ Endpoint : $ENDPOINT_URL"
          echo "→ dryRun   : ${{ steps.params.outputs.dry_run }}"
          echo "→ Body     : $REQUEST_BODY"
          echo "────────────────────────────────────"

          # Write body to a temp file to avoid shell quoting issues
          printf '%s' "$REQUEST_BODY" > /tmp/request.json

          # set +e: capture curl exit code manually instead of failing silently.
          # Previously the step died at this line (exit 56 = RECV_ERROR) before
          # printing HTTP status or response body — making failures undiagnosable.
          set +e
          curl --connect-timeout 20 --max-time 280 -sS \
            -X POST "$ENDPOINT_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d @/tmp/request.json \
            -o /tmp/response.json \
            -w "%{http_code}" > /tmp/http_status.txt
          CURL_EXIT=$?
          set -e

          HTTP_STATUS=$(cat /tmp/http_status.txt 2>/dev/null || echo "000")

          echo "← curl exit   : $CURL_EXIT"
          echo "← HTTP Status : $HTTP_STATUS"
          echo "← Response:"
          jq . /tmp/response.json 2>/dev/null || cat /tmp/response.json || echo "(no response body)"

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo ""
            echo "::error::curl failed with exit $CURL_EXIT (connection/timeout error). See response above."
            exit "$CURL_EXIT"
          fi

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo ""
            echo "::error::Endpoint returned non-2xx status ($HTTP_STATUS). Check response above."
            exit 1
          fi

  # ── Job 2: CRM Automations ───────────────────────────────────────────────────
  #
  # Fires on the 0 11 * * * schedule or when workflow_dispatch targets
  # automations/both. Covers REACTIVATION, BIRTHDAY, and POST_ORDER triggers.
  # ─────────────────────────────────────────────────────────────────────────────
  run-automations:
    name: "CRM Automations"
    runs-on: ubuntu-latest
    # Tick novo cancela o anterior encalhado na fila. Dois efeitos: o run
    # conclui como `cancelled` (e o GitHub NAO manda e-mail de cancelamento,
    # so de falha), e some o zumbi de 90 minutos — um tick liberado tarde
    # dispararia um lote velho em cima de cliente real.
    concurrency:
      group: crm-cron-run-automations
      cancel-in-progress: true
    timeout-minutes: 10
    if: >-
      github.event.schedule == '0 11 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'automations' || inputs.target == 'both'))

    steps:
      - name: Build request parameters
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          BASE_URL="${BASE_URL%/}"
          echo "url=${BASE_URL}/api/cron/execute-crm-automations" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo 'body={"dryRun":false}' >> "$GITHUB_OUTPUT"
            echo "dry_run=false"         >> "$GITHUB_OUTPUT"
          else
            DRY_RUN="${{ inputs.dry_run }}"
            BODY="{\"dryRun\":${DRY_RUN}"

            [[ -n "${{ inputs.restaurant_id }}" ]] \
              && BODY="${BODY},\"restaurantId\":\"${{ inputs.restaurant_id }}\""

            BODY="${BODY}}"
            echo "body=${BODY}"       >> "$GITHUB_OUTPUT"
            echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          fi

      - name: "POST /api/cron/execute-crm-automations"
        env:
          ENDPOINT_URL: ${{ steps.params.outputs.url }}
          REQUEST_BODY: ${{ steps.params.outputs.body }}
          CRON_SECRET:  ${{ secrets.CRON_SECRET }}
        run: |
          echo "────────────────────────────────────"
          echo "→ Endpoint : $ENDPOINT_URL"
          echo "→ dryRun   : ${{ steps.params.outputs.dry_run }}"
          echo "→ Body     : $REQUEST_BODY"
          echo "────────────────────────────────────"

          printf '%s' "$REQUEST_BODY" > /tmp/request.json

          set +e
          curl --connect-timeout 20 --max-time 120 -sS \
            -X POST "$ENDPOINT_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d @/tmp/request.json \
            -o /tmp/response.json \
            -w "%{http_code}" > /tmp/http_status.txt
          CURL_EXIT=$?
          set -e

          HTTP_STATUS=$(cat /tmp/http_status.txt 2>/dev/null || echo "000")

          echo "← curl exit   : $CURL_EXIT"
          echo "← HTTP Status : $HTTP_STATUS"
          echo "← Response:"
          jq . /tmp/response.json 2>/dev/null || cat /tmp/response.json || echo "(no response body)"

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo ""
            echo "::error::curl failed with exit $CURL_EXIT (connection/timeout error). See response above."
            exit "$CURL_EXIT"
          fi

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo ""
            echo "::error::Endpoint returned non-2xx status ($HTTP_STATUS). Check response above."
            exit 1
          fi

      # Daily tier reclassification for the relationship program (rolling window).
      # Best-effort — a reclassify hiccup must not fail the automations job.
      - name: "POST /api/cron/crm/reclassify-tiers"
        if: ${{ github.event_name == 'schedule' }}
        env:
          BASE_URL:    ${{ secrets.FOOCCI_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="${BASE_URL%/}/api/cron/crm/reclassify-tiers"
          echo "→ Reclassify tiers: $URL"
          curl --connect-timeout 20 --max-time 180 -sS \
            -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}' || echo "::warning::reclassify-tiers call failed (non-blocking)"

  # ── Job 3: Cart Recovery ─────────────────────────────────────────────────────
  #
  # PRIMARY runner: CartRecoveryScheduler (src/services/order/CartRecoveryScheduler.ts)
  # fires every 60 s inside the Railway Node.js process — true 1-minute resolution.
  #
  # This GitHub Actions job (*/5) is a BACKUP: it covers the ~60 s window after
  # a Railway restart before the in-process scheduler fires its first tick.
  # It is fully idempotent — the DB-level anti-spam guards (recoveryAttempts=0,
  # lastRecoveryAt 24 h) prevent double-sends even when both run concurrently.
  #
  # Anti-spam: max 1 per draft (ever), max 1 per customer per day.
  # ─────────────────────────────────────────────────────────────────────────────
  send-cart-recovery:
    name: "Cart Recovery"
    runs-on: ubuntu-latest
    # Tick novo cancela o anterior encalhado na fila. Dois efeitos: o run
    # conclui como `cancelled` (e o GitHub NAO manda e-mail de cancelamento,
    # so de falha), e some o zumbi de 90 minutos — um tick liberado tarde
    # dispararia um lote velho em cima de cliente real.
    concurrency:
      group: crm-cron-send-cart-recovery
      cancel-in-progress: true
    timeout-minutes: 5
    if: >-
      github.event.schedule == '*/5 * * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'cart-recovery'))

    steps:
      - name: Build request parameters
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          BASE_URL="${BASE_URL%/}"
          echo "url=${BASE_URL}/api/cron/send-cart-recovery" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo 'body={"dryRun":false,"inactivityMinutes":2,"limit":50}' >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            DRY_RUN="${{ inputs.cart_recovery_dry_run }}"
            echo "body={\"dryRun\":${DRY_RUN},\"inactivityMinutes\":2,\"limit\":50}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          fi

      - name: "POST /api/cron/send-cart-recovery"
        env:
          ENDPOINT_URL: ${{ steps.params.outputs.url }}
          REQUEST_BODY: ${{ steps.params.outputs.body }}
          CRON_SECRET:  ${{ secrets.CRON_SECRET }}
        run: |
          echo "────────────────────────────────────"
          echo "→ Endpoint : $ENDPOINT_URL"
          echo "→ dryRun   : ${{ steps.params.outputs.dry_run }}"
          echo "→ Body     : $REQUEST_BODY"
          echo "────────────────────────────────────"

          printf '%s' "$REQUEST_BODY" > /tmp/request.json

          set +e
          curl --connect-timeout 20 --max-time 60 -sS \
            -X POST "$ENDPOINT_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d @/tmp/request.json \
            -o /tmp/response.json \
            -w "%{http_code}" > /tmp/http_status.txt
          CURL_EXIT=$?
          set -e

          HTTP_STATUS=$(cat /tmp/http_status.txt 2>/dev/null || echo "000")

          echo "← curl exit   : $CURL_EXIT"
          echo "← HTTP Status : $HTTP_STATUS"
          echo "← Response:"
          jq . /tmp/response.json 2>/dev/null || cat /tmp/response.json || echo "(no response body)"

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo ""
            echo "::error::curl failed with exit $CURL_EXIT. See response above."
            exit "$CURL_EXIT"
          fi

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo ""
            echo "::error::Endpoint returned non-2xx status ($HTTP_STATUS). Check response above."
            exit 1
          fi
