# ─────────────────────────────────────────────────────────────────────────────
# WhatsApp Text Order — EMERGENCY ROLLBACK (30-second kill).
# Sets paused=true + DRY_RUN_ONLY + PHONE_ALLOWLIST. Text Order stops for final
# customers immediately; the normal receptionist keeps answering; allowlist,
# config and history are preserved; no order is deleted. Config-only. Manual.
# Uses CRON_SECRET.
# ─────────────────────────────────────────────────────────────────────────────

name: WhatsApp Text Order — EMERGENCY Rollback

on:
  workflow_dispatch:
    inputs:
      restaurant_slug:
        description: "Restaurant slug"
        required: true
        default: "sushi-cazza"
      confirm:
        description: "Digite EXATAMENTE: ROLLBACK_WHATSAPP_TEXT_ORDER"
        required: true
        default: ""

jobs:
  rollback:
    name: "Emergency Rollback (config-only)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build URL
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="${{ secrets.QUALITY_AUDIT_URL }}"; fi
          BASE_URL="${BASE_URL%/}"
          echo "url=${BASE_URL}/api/cron/whatsapp/text-order-rollback" >> "$GITHUB_OUTPUT"

      - name: "Rollback"
        env:
          URL: ${{ steps.params.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SLUG: ${{ inputs.restaurant_slug }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -e
          BODY=$(jq -nc --arg slug "$SLUG" --arg confirm "$CONFIRM" '{restaurantSlug:$slug, confirm:$confirm}')
          curl --connect-timeout 20 --max-time 120 -sS -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d "$BODY" -o /tmp/r.json -w "%{http_code}" > /tmp/code.txt || true
          echo "← success        : $(jq -r '.success' /tmp/r.json)"
          echo "← before         : $(jq -rc '.before' /tmp/r.json)"
          echo "← after          : $(jq -rc '.after' /tmp/r.json)"
          echo "← runtimeTouched : $(jq -r '.runtimeTouched' /tmp/r.json)"
          echo "← error          : $(jq -r '.error // "—"' /tmp/r.json)"
          if [[ "$(jq -r '.success' /tmp/r.json)" != "true" ]]; then echo "::error::rollback falhou: $(jq -r '.error' /tmp/r.json)"; exit 1; fi
          echo "✅ Rollback aplicado — Text Order pausado (DRY_RUN_ONLY + PHONE_ALLOWLIST). Recepcionista segue atendendo."
