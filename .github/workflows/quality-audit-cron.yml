# ─────────────────────────────────────────────────────────────────────────────
# Quality Audit Cron — Foocci daily Quality Control audit
#
# Runs the read-only Quality Control auditors every night and persists the
# result as source="CRON", so Diego opens /admin/quality in the morning with a
# fresh audit already done. The endpoint is 100% read-only/SafeMode: it never
# sends WhatsApp, creates an order, generates Pix or touches runtime.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions) — the
# SAME ones already used by the CRM cron, so no new configuration is needed:
#
#   FOOCCI_BASE_URL   Production URL with no trailing slash.
#                     Example: https://foocci-production.up.railway.app
#                     (alias: set QUALITY_AUDIT_URL to the same value if you
#                      prefer a dedicated variable — see the fallback below.)
#
#   CRON_SECRET       Must match the CRON_SECRET env var set in Railway.
#                     Never printed in logs — injected via env:, not ${{ }}.
#
# Schedule: daily at 06:30 UTC = 03:30 America/Sao_Paulo (BRT).
# ─────────────────────────────────────────────────────────────────────────────

name: Quality Audit Cron

on:
  schedule:
    # Daily at 06:30 UTC = 03:30 Brasília
    - cron: "30 6 * * *"

  workflow_dispatch: {}

jobs:
  run-quality-audit:
    name: "Daily Quality Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Build endpoint URL
        id: params
        run: |
          # Prefer FOOCCI_BASE_URL (project standard); fall back to QUALITY_AUDIT_URL.
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="${{ secrets.QUALITY_AUDIT_URL }}"; fi
          BASE_URL="${BASE_URL%/}"   # strip any trailing slash
          echo "url=${BASE_URL}/api/cron/quality/run" >> "$GITHUB_OUTPUT"

      # CRON_SECRET is injected via env: so it never appears in the step
      # definition or in workflow logs (GitHub masks it automatically).
      - name: "POST /api/cron/quality/run"
        env:
          ENDPOINT_URL: ${{ steps.params.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "────────────────────────────────────"
          echo "→ Endpoint : $ENDPOINT_URL"
          echo "────────────────────────────────────"

          set +e
          curl --connect-timeout 20 --max-time 180 -sS \
            -X POST "$ENDPOINT_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -o /tmp/response.json \
            -w "%{http_code}" > /tmp/http_status.txt
          CURL_EXIT=$?
          set -e

          HTTP_STATUS=$(cat /tmp/http_status.txt 2>/dev/null || echo "000")

          echo "← curl exit   : $CURL_EXIT"
          echo "← HTTP Status : $HTTP_STATUS"
          echo "← Response:"
          jq . /tmp/response.json 2>/dev/null || cat /tmp/response.json || echo "(no response body)"

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo ""
            echo "::error::curl failed with exit $CURL_EXIT (connection/timeout error). See response above."
            exit "$CURL_EXIT"
          fi

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo ""
            echo "::error::Endpoint returned non-2xx status ($HTTP_STATUS). Check response above."
            exit 1
          fi
