name: Set Google OAuth env (one-off)

# Sets the 3 Google integration variables on Railway using the SAME credentials
# the deploy workflow already uses (RAILWAY_TOKEN / RAILWAY_PROJECT_ID GitHub
# secrets). Values arrive as run inputs (never committed). Triggered on demand.

# Reads the two Google credentials from GitHub Actions SECRETS (so the secret
# never transits through any chat/API — GitHub's secret scanning blocks that by
# design). Add these repo secrets once:
#   GOOGLE_OAUTH_CLIENT_ID
#   GOOGLE_OAUTH_CLIENT_SECRET
# base_url is public and defaults to the canonical domain.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "FOOCCI_BASE_URL"
        required: true
        default: "https://foocci.com.br"

jobs:
  set-vars:
    name: Set Railway variables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.RAILWAY_TOKEN }}" ]              && MISSING+=("RAILWAY_TOKEN")
          [ -z "${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}" ]     && MISSING+=("GOOGLE_OAUTH_CLIENT_ID")
          [ -z "${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}" ] && MISSING+=("GOOGLE_OAUTH_CLIENT_SECRET")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing GitHub secrets: ${MISSING[*]}"
            echo "  Add at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "All required secrets present."

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set Google variables (auto-redeploys)
        env:
          RAILWAY_TOKEN:      ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          CID:  ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          CSEC: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          BURL: ${{ inputs.base_url }}
        run: |
          echo "::add-mask::$CSEC"
          echo "Setting GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET / FOOCCI_BASE_URL on service FOOCCI (production)…"
          railway variables \
            --service     FOOCCI \
            --environment production \
            --set "GOOGLE_OAUTH_CLIENT_ID=$CID" \
            --set "GOOGLE_OAUTH_CLIENT_SECRET=$CSEC" \
            --set "FOOCCI_BASE_URL=$BURL"
          echo "Variables set. Railway will redeploy."

      - name: Post-set health check
        run: |
          echo "Waiting for Railway to pick up the variable change…"
          sleep 45
          for attempt in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://foocci.com.br/api/health || echo "000")
            echo "Attempt $attempt — HTTP $STATUS"
            [ "$STATUS" = "200" ] && { echo "Health OK."; exit 0; }
            sleep 15
          done
          echo "::warning::Health not 200 yet — service may still be restarting."
          exit 0
