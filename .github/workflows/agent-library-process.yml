# ─────────────────────────────────────────────────────────────────────────────
# Agent Library — Deep Extraction Processor
#
# Drives background deep chunked extraction: every few minutes it POSTs to the
# processor endpoint, which advances a budget of pending chunks (one LLM call
# each) and consolidates finished jobs. Long materials thus complete over many
# short invocations. Idempotent — a run with no pending work is a safe no-op.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions) — the
# SAME ones already used by the other crons (no new secret):
#
#   FOOCCI_BASE_URL   Production URL with no trailing slash.
#   CRON_SECRET       Must match the CRON_SECRET env var set in Railway.
#                     Never printed in logs — injected via env:, not ${{ }}.
#
# Schedule: every 5 minutes. (Lower to */10 if cost is a concern — each run uses
# at most `limit` LLM calls.)
# ─────────────────────────────────────────────────────────────────────────────

name: Agent Library Deep Extraction Processor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max chunks to process this run (1–20)"
        required: false
        default: "5"
        type: string

jobs:
  process-chunks:
    name: "Process pending chunks"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Build request parameters
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="${{ secrets.QUALITY_AUDIT_URL }}"; fi
          BASE_URL="${BASE_URL%/}"   # strip any trailing slash
          echo "url=${BASE_URL}/api/cron/agent-library/process" >> "$GITHUB_OUTPUT"

          LIMIT="5"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.limit }}" ]]; then
            LIMIT="${{ inputs.limit }}"
          fi
          echo "body={\"limit\":${LIMIT}}" >> "$GITHUB_OUTPUT"

      # CRON_SECRET is injected via env: so it never appears in the step
      # definition or in workflow logs (GitHub masks it automatically).
      - name: "POST /api/cron/agent-library/process"
        env:
          ENDPOINT_URL: ${{ steps.params.outputs.url }}
          REQUEST_BODY: ${{ steps.params.outputs.body }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "────────────────────────────────────"
          echo "→ Endpoint : $ENDPOINT_URL"
          echo "→ Body     : $REQUEST_BODY"
          echo "────────────────────────────────────"

          printf '%s' "$REQUEST_BODY" > /tmp/request.json

          set +e
          curl --connect-timeout 20 --max-time 180 -sS \
            -X POST "$ENDPOINT_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d @/tmp/request.json \
            -o /tmp/response.json \
            -w "%{http_code}" > /tmp/http_status.txt
          CURL_EXIT=$?
          set -e

          HTTP_STATUS=$(cat /tmp/http_status.txt 2>/dev/null || echo "000")

          # Print ONLY safe summary fields — never chunk text / techniques / secret.
          OK=$(jq          -r '.ok // "?"'               /tmp/response.json 2>/dev/null)
          PROCESSED=$(jq   -r '.processed // "?"'        /tmp/response.json 2>/dev/null)
          CONSOLIDATED=$(jq -r '.consolidatedJobs // "?"' /tmp/response.json 2>/dev/null)
          CREATED=$(jq     -r '.techniquesCreated // "?"' /tmp/response.json 2>/dev/null)
          REMAINING=$(jq   -r '.remainingPending // "?"'  /tmp/response.json 2>/dev/null)
          ERROR=$(jq       -r '.error // ""'              /tmp/response.json 2>/dev/null)

          echo "← curl exit          : $CURL_EXIT"
          echo "← HTTP Status        : $HTTP_STATUS"
          echo "← ok                 : $OK"
          echo "← chunks processed   : $PROCESSED"
          echo "← jobs consolidated  : $CONSOLIDATED"
          echo "← techniques created : $CREATED"
          echo "← remaining pending  : $REMAINING"
          [[ -n "$ERROR" ]] && echo "← error              : $ERROR"

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::curl failed with exit $CURL_EXIT (connection/timeout error)."
            exit "$CURL_EXIT"
          fi

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::Endpoint returned non-2xx status ($HTTP_STATUS)."
            exit 1
          fi

          echo "✅ Processor OK — $PROCESSED chunk(s), $CONSOLIDATED job(s) consolidated, $REMAINING pending."
