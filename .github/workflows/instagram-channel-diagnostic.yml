# ─────────────────────────────────────────────────────────────────────────────
# Instagram Direct — channel diagnostic (hermetic, manual)
#
# Proves the Instagram Direct foundation without sending any real Direct message:
# parser, signature gate, mode gates, dry-run send, and (with a restaurant slug)
# a synthetic inbound round-trip that is cleaned up. Asserts PASS,
# noRealInstagramSend=true and runtimeTouched=false. Uses CRON_SECRET.
# ─────────────────────────────────────────────────────────────────────────────

name: Instagram Channel Diagnostic

on:
  workflow_dispatch:
    inputs:
      restaurant_slug:
        description: "Optional restaurant slug for the synthetic round-trip (leave empty for pure checks)"
        required: false
        default: ""

jobs:
  diagnostic:
    name: "Instagram Channel Diagnostic"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build URL
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="${{ secrets.QUALITY_AUDIT_URL }}"; fi
          BASE_URL="${BASE_URL%/}"
          echo "url=${BASE_URL}/api/cron/instagram/channel-diagnostic" >> "$GITHUB_OUTPUT"

      - name: "Run diagnostic"
        env:
          URL: ${{ steps.params.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SLUG: ${{ inputs.restaurant_slug }}
        run: |
          BODY=$(jq -nc --arg slug "$SLUG" '(if $slug != "" then {restaurantSlug: $slug} else {} end)')
          set +e
          curl --connect-timeout 20 --max-time 120 -sS -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d "$BODY" -o /tmp/ig.json -w "%{http_code}" > /tmp/code.txt
          set -e
          HTTP=$(cat /tmp/code.txt)
          STATUS=$(jq -r '.status' /tmp/ig.json 2>/dev/null)
          RT=$(jq -r '.runtimeTouched' /tmp/ig.json 2>/dev/null)
          NOSEND=$(jq -r '.noRealInstagramSend' /tmp/ig.json 2>/dev/null)
          echo "← HTTP                 : $HTTP"
          echo "← status              : $STATUS"
          echo "← passed/total        : $(jq -r '.passed' /tmp/ig.json)/$(jq -r '.total' /tmp/ig.json)"
          echo "← noRealInstagramSend : $NOSEND"
          echo "← runtimeTouched      : $RT"
          echo "── checks ──"
          jq -r '.checks[]? | "\(if .pass then "✓" else "✗" end) \(.name)\(if .pass then "" else " — " + .note end)"' /tmp/ig.json 2>/dev/null || true
          if [[ "$HTTP" -lt 200 || "$HTTP" -ge 300 ]]; then echo "::error::diagnostic non-2xx ($HTTP)."; exit 1; fi
          if [[ "$STATUS" != "PASS" ]]; then echo "::error::status=$STATUS"; exit 1; fi
          if [[ "$NOSEND" != "true" || "$RT" != "false" ]]; then echo "::error::safety flags failed"; exit 1; fi
          echo "✅ Instagram channel diagnostic: PASS — nada enviado, nenhum dado residual."
