# ─────────────────────────────────────────────────────────────────────────────
# Waiter Simulation Lab — manual run (cron-safe)
#
# Runs a small, safe Waiter simulation batch in production and persists the run +
# opportunities for human review. Fully dry-run: no order, no Pix, no WhatsApp, no
# runtime mutation. Uses CRON_SECRET — NOT ADMIN_SECRET.
#
# Runs manually (workflow_dispatch) AND once a day on a conservative schedule —
# a "daily automatic lab", not 24/7 spam. The endpoint derives a daily seed so the
# scenarios vary by date instead of repeating.
#
# Required GitHub Secrets (already used by the other crons — no new secret):
#   FOOCCI_BASE_URL   Production URL with no trailing slash.
#   CRON_SECRET       Must match the CRON_SECRET env var set in Railway.
# ─────────────────────────────────────────────────────────────────────────────

name: Waiter Simulation Lab Run

on:
  workflow_dispatch: {}
  schedule:
    - cron: "45 6 * * *" # 06:45 UTC ≈ 03:45 BRT — one small batch per day

jobs:
  run-waiter-simulation:
    name: "Waiter Simulation Run"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Build endpoint URL
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="${{ secrets.QUALITY_AUDIT_URL }}"; fi
          BASE_URL="${BASE_URL%/}"
          echo "url=${BASE_URL}/api/cron/agents/waiter/simulation/run" >> "$GITHUB_OUTPUT"

      - name: "POST /api/cron/agents/waiter/simulation/run"
        env:
          ENDPOINT_URL: ${{ steps.params.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "────────────────────────────────────"
          echo "→ Endpoint : $ENDPOINT_URL"
          echo "────────────────────────────────────"

          set +e
          curl --connect-timeout 20 --max-time 180 -sS \
            -X POST "$ENDPOINT_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"scenarioCount":12}' \
            -o /tmp/response.json \
            -w "%{http_code}" > /tmp/http_status.txt
          CURL_EXIT=$?
          set -e

          HTTP_STATUS=$(cat /tmp/http_status.txt 2>/dev/null || echo "000")

          # Safe summary only — never transcripts/secrets.
          STATUS=$(jq  -r '.status // "?"'            /tmp/response.json 2>/dev/null)
          TOTAL=$(jq   -r '.scenariosTotal // "?"'    /tmp/response.json 2>/dev/null)
          P0=$(jq      -r '.p0Count // "?"'           /tmp/response.json 2>/dev/null)
          OPPS=$(jq    -r '.opportunityCount // "?"'  /tmp/response.json 2>/dev/null)
          RUNTIME=$(jq -r '.runtimeTouched'           /tmp/response.json 2>/dev/null)
          MESSAGE=$(jq -r '.message // ""'            /tmp/response.json 2>/dev/null)

          echo "← curl exit          : $CURL_EXIT"
          echo "← HTTP Status        : $HTTP_STATUS"
          echo "← status             : $STATUS"
          echo "← scenariosTotal     : $TOTAL"
          echo "← p0Count            : $P0"
          echo "← opportunityCount   : $OPPS"
          echo "← runtimeTouched     : $RUNTIME"
          echo "← message            : $MESSAGE"

          if [ "$CURL_EXIT" -ne 0 ]; then echo "::error::curl failed with exit $CURL_EXIT."; exit "$CURL_EXIT"; fi
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then echo "::error::non-2xx ($HTTP_STATUS)."; exit 1; fi
          if [[ "$STATUS" != "PASS" ]]; then echo "::error::status='$STATUS' (expected PASS). $MESSAGE"; exit 1; fi
          if [[ "$RUNTIME" != "false" ]]; then echo "::error::runtimeTouched='$RUNTIME' (expected false)."; exit 1; fi
          # A simulation that surfaces a P0 must fail the job so it is noticed.
          if ! [[ "$P0" =~ ^0$ ]]; then echo "::error::p0Count='$P0' (expected 0) — Waiter simulation found a critical issue."; exit 1; fi

          echo "✅ Waiter simulation run OK — $TOTAL cenários, P0=$P0, oportunidades=$OPPS, runtime intocado."
