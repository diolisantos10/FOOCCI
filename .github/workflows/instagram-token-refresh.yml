# ─────────────────────────────────────────────────────────────────────────────
# Instagram Direct — long-lived token refresh (daily)
#
# Instagram user tokens last ~60 days. Without refreshing, they silently expire and
# inbound DMs stop arriving. This calls the refresh endpoint daily to extend every
# token that is nearing expiry. Uses CRON_SECRET.
#
# NOTE: GitHub `on: schedule` only fires from the repository's DEFAULT branch. Until
# this file is on the default branch, run it via workflow_dispatch.
# ─────────────────────────────────────────────────────────────────────────────

name: Instagram Token Refresh

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    name: "Instagram Token Refresh"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build URL
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="${{ secrets.QUALITY_AUDIT_URL }}"; fi
          BASE_URL="${BASE_URL%/}"
          echo "url=${BASE_URL}/api/cron/instagram/refresh-tokens" >> "$GITHUB_OUTPUT"

      - name: "Refresh tokens"
        id: varredura
        continue-on-error: true
        env:
          URL: ${{ steps.params.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +e
          curl --connect-timeout 20 --max-time 120 -sS -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d '{}' -o /tmp/ig-refresh.json -w "%{http_code}" > /tmp/code.txt
          set -e
          HTTP=$(cat /tmp/code.txt)
          echo "← HTTP         : $HTTP"
          echo "← totalConfigs : $(jq -r '.totalConfigs // "?"' /tmp/ig-refresh.json 2>/dev/null)"
          echo "← checked      : $(jq -r '.checked' /tmp/ig-refresh.json 2>/dev/null)"
          echo "← refreshed    : $(jq -r '.refreshed' /tmp/ig-refresh.json 2>/dev/null)"
          if [[ "$HTTP" -lt 200 || "$HTTP" -ge 300 ]]; then echo "::error::refresh non-2xx ($HTTP)."; exit 1; fi

          # This job ran green every single day while a client's Instagram was dead for
          # ten days. The account had dropped out of the query, so the sweep answered
          # {checked:0, refreshed:0} and the step printed "✅ executado".
          # A gate that cannot fail is not a gate — fail loudly, with the reason attached.
          NEEDS=$(jq -r '.needsAttention // false' /tmp/ig-refresh.json 2>/dev/null)
          if [[ "$NEEDS" == "true" ]]; then
            jq -r '.attention[]? | "::error::" + .' /tmp/ig-refresh.json 2>/dev/null
            # Este job falhou em 03, 04 e 05 de agosto, sozinho, sem ninguém ver — e o
            # Instagram do cliente seguiu mudo. Falhar aqui não é avisar: por isso o
            # endpoint também manda o aviso por WhatsApp. Se NEM ISSO saiu, diga.
            ALERT=$(jq -r '.alertSent // false' /tmp/ig-refresh.json 2>/dev/null)
            REASON=$(jq -r '.alertReason // "—"' /tmp/ig-refresh.json 2>/dev/null)
            if [[ "$ALERT" == "true" ]]; then
              echo "📲 aviso enviado por WhatsApp ao responsável."
            else
              echo "::error::O aviso por WhatsApp NÃO saiu ($REASON). Este log é o único lugar onde o problema aparece — e ninguém lê log."
            fi
            echo "::error::Instagram token refresh precisa de atenção humana — veja as linhas acima."
            exit 1
          fi
          echo "✅ Instagram token refresh executado sem pendências."

      # ⭐ 04/10/2026, ordem do CEO: "isso precisa parar" (a caixa de e-mail cheia
      # de falhas). Falha desta rotina vira CHAMADO na Sala de Manutenção da
      # Control Room, com a evidência dentro. Chamado aberto (201) → a rotina
      # termina verde e o e-mail não sai. ⛔ Sem token ou com a porta recusando,
      # a rotina FALHA como antes (guardrail 2: sem portão = reprovado) — o
      # e-mail é o canal de reserva, nunca o silêncio.
      - name: "Abrir chamado na Sala de Manutenção (em vez de só e-mail)"
        if: always() && steps.varredura.outcome == 'failure'
        env:
          CR_URL: ${{ secrets.CONTROL_ROOM_URL }}
          CR_TOKEN: ${{ secrets.CONTROL_ROOM_SERVICE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EVID=$(jq -r '[.attention[]?] | join(" | ")' /tmp/ig-refresh.json 2>/dev/null)
          [ -z "$EVID" ] && EVID="a rotina falhou sem lista de atenção (veja o log)"
          if [ -z "$CR_URL" ] || [ -z "$CR_TOKEN" ]; then
            echo "::error::Chamado NÃO aberto: falta o token de serviço do Foocci na Control Room (segredos CONTROL_ROOM_URL / CONTROL_ROOM_SERVICE_TOKEN). Emitir token é ato do CEO. A rotina falha para o aviso sair por e-mail."
            exit 1
          fi
          CORPO=$(jq -n --arg p "foocci" --arg d "Instagram Token Refresh: $EVID" --arg e "$RUN_URL" \
            '{produtoAfetado:$p, descricao:$d, gravidade:"critico", evidencia:$e}')
          HTTP=$(curl -sS -m 20 -o /tmp/chamado.json -w "%{http_code}" -X POST "${CR_URL%/}/manutencao/chamados" \
            -H "Content-Type: application/json" -H "X-Service-Token: $CR_TOKEN" -d "$CORPO" || echo 000)
          if [ "$HTTP" = "201" ]; then
            echo "::notice title=Chamado aberto na Sala de Manutenção::$(jq -r '.chamadoId' /tmp/chamado.json) — Instagram Token Refresh"
            exit 0
          fi
          echo "::error::A Control Room recusou o chamado (HTTP $HTTP). A rotina falha para o aviso sair por e-mail."
          exit 1
