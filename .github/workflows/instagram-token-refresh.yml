# ─────────────────────────────────────────────────────────────────────────────
# Instagram Direct — long-lived token refresh (daily)
#
# Instagram user tokens last ~60 days. Without refreshing, they silently expire and
# inbound DMs stop arriving. This calls the refresh endpoint daily to extend every
# token that is nearing expiry. Uses CRON_SECRET.
#
# NOTE: GitHub `on: schedule` only fires from the repository's DEFAULT branch. Until
# this file is on the default branch, run it via workflow_dispatch.
# ─────────────────────────────────────────────────────────────────────────────

name: Instagram Token Refresh

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    name: "Instagram Token Refresh"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build URL
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="${{ secrets.QUALITY_AUDIT_URL }}"; fi
          BASE_URL="${BASE_URL%/}"
          echo "url=${BASE_URL}/api/cron/instagram/refresh-tokens" >> "$GITHUB_OUTPUT"

      - name: "Refresh tokens"
        env:
          URL: ${{ steps.params.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +e
          curl --connect-timeout 20 --max-time 120 -sS -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d '{}' -o /tmp/ig-refresh.json -w "%{http_code}" > /tmp/code.txt
          set -e
          HTTP=$(cat /tmp/code.txt)
          echo "← HTTP      : $HTTP"
          echo "← checked   : $(jq -r '.checked' /tmp/ig-refresh.json 2>/dev/null)"
          echo "← refreshed : $(jq -r '.refreshed' /tmp/ig-refresh.json 2>/dev/null)"
          if [[ "$HTTP" -lt 200 || "$HTTP" -ge 300 ]]; then echo "::error::refresh non-2xx ($HTTP)."; exit 1; fi
          echo "✅ Instagram token refresh executado."
