# ─────────────────────────────────────────────────────────────────────────────
# CRM Cold Campaign — recovery diagnostic + ledger backfill (cron-safe, manual)
#
# Step A: read-only scan of the old "cold customer recovery" campaigns (metadata
#         + counts only, NO message text, NO customer PII).
# Step B: ledger backfill — DEFAULTS TO DRY-RUN (counts only, writes nothing).
#         A REAL backfill requires explicitly setting dry_run=false on dispatch.
#
# Manual only (workflow_dispatch). Uses CRON_SECRET — NOT ADMIN_SECRET.
# Never sends WhatsApp, never activates a campaign, never deletes anything.
# ─────────────────────────────────────────────────────────────────────────────

name: CRM Cold Campaign Recovery

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Backfill dry-run? (true = count only, false = write the ledger)"
        type: choice
        default: "true"
        options: ["true", "false"]
      campaign_family_key:
        description: "Concept key for the cold campaign"
        type: string
        default: "reativacao-frios"
      campaign_id:
        description: "Optional: old cold campaignId to scope the backfill"
        type: string
        default: ""
      limit:
        description: "Max executions to scan"
        type: string
        default: "500"

jobs:
  cold-recovery:
    name: "CRM Cold Recovery"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build URLs
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="${{ secrets.QUALITY_AUDIT_URL }}"; fi
          BASE_URL="${BASE_URL%/}"
          echo "recovery=${BASE_URL}/api/cron/crm/cold-recovery-diagnostic" >> "$GITHUB_OUTPUT"
          echo "backfill=${BASE_URL}/api/cron/crm/contact-ledger-backfill"   >> "$GITHUB_OUTPUT"

      - name: "Step A — cold recovery diagnostic (read-only)"
        env:
          URL: ${{ steps.params.outputs.recovery }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +e
          curl --connect-timeout 20 --max-time 180 -sS -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d '{}' \
            -o /tmp/recovery.json -w "%{http_code}" > /tmp/rcode.txt
          set -e
          echo "← HTTP            : $(cat /tmp/rcode.txt)"
          echo "← ok              : $(jq -r '.ok' /tmp/recovery.json 2>/dev/null)"
          echo "← recommendedKey  : $(jq -r '.recommendedFamilyKey // "?"' /tmp/recovery.json 2>/dev/null)"
          echo "← coldCampaigns   : $(jq -r '.totals.campaigns // 0' /tmp/recovery.json 2>/dev/null)"
          echo "← sentExecutions  : $(jq -r '.totals.sentExecutions // 0' /tmp/recovery.json 2>/dev/null)"
          echo "← alreadyInLedger : $(jq -r '.totals.alreadyInLedger // 0' /tmp/recovery.json 2>/dev/null)"
          echo "← wouldBackfill   : $(jq -r '.totals.wouldBackfill // 0' /tmp/recovery.json 2>/dev/null)"
          echo "── candidates (id · restaurante · status · sent · bloqueados · falhas · semanalCap · jáNoLedger · familyKey) ──"
          jq -r '.candidates[]? | "\(.campaignId) · \(.restaurantId) · \(.status) · sent=\(.sentExecutions) · blocked=\(.blockedSafety) · failed=\(.failedProvider) · weeklyCap=\(.weeklyCapBlocks) · ledger=\(.alreadyInLedger) · \(.campaignFamilyKey // .suggestedFamilyKey)"' /tmp/recovery.json 2>/dev/null || true

      - name: "Step B — ledger backfill (DRY-RUN unless dry_run=false)"
        env:
          URL: ${{ steps.params.outputs.backfill }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          FAMILY_KEY: ${{ inputs.campaign_family_key }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          LIMIT: ${{ inputs.limit }}
        run: |
          BODY=$(jq -nc --argjson dry "$([[ "$DRY_RUN" == "false" ]] && echo false || echo true)" \
                       --arg fk "$FAMILY_KEY" --arg cid "$CAMPAIGN_ID" --argjson lim "${LIMIT:-500}" \
                       '{dryRun:$dry, campaignFamilyKey:$fk, limit:$lim} + (if $cid=="" then {} else {campaignId:$cid} end)')
          echo "→ payload (sem dados sensíveis): $BODY"
          set +e
          curl --connect-timeout 20 --max-time 180 -sS -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d "$BODY" \
            -o /tmp/backfill.json -w "%{http_code}" > /tmp/bcode.txt
          set -e
          HTTP=$(cat /tmp/bcode.txt)
          echo "← HTTP               : $HTTP"
          echo "← dryRun             : $(jq -r '.dryRun' /tmp/backfill.json 2>/dev/null)"
          echo "← sentFound          : $(jq -r '.sentFound // "?"' /tmp/backfill.json 2>/dev/null)"
          echo "← alreadyInLedger    : $(jq -r '.alreadyInLedger // "?"' /tmp/backfill.json 2>/dev/null)"
          echo "← created/wouldCreate: $(jq -r '.created // "?"' /tmp/backfill.json 2>/dev/null)"
          echo "← withoutCampaign    : $(jq -r '.withoutCampaign // 0' /tmp/backfill.json 2>/dev/null)"
          echo "← withoutFamilyKey   : $(jq -r '.withoutFamilyKey // 0' /tmp/backfill.json 2>/dev/null)"
          echo "← withoutFingerprint : $(jq -r '.withoutFingerprint // 0' /tmp/backfill.json 2>/dev/null)"
          echo "← warnings           : $(jq -rc '.warnings // []' /tmp/backfill.json 2>/dev/null)"
          if [[ "$HTTP" -lt 200 || "$HTTP" -ge 300 ]]; then echo "::error::backfill non-2xx ($HTTP)."; exit 1; fi
          echo "✅ Cold recovery + backfill ($([[ "$DRY_RUN" == "false" ]] && echo REAL || echo dry-run)) concluído."
