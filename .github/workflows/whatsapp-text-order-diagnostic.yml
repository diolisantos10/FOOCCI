# ─────────────────────────────────────────────────────────────────────────────
# WhatsApp Text Order — diagnostic (hermetic, manual)
#
# Runs the synthetic "anotador de pedido" diagnostic in production: pure state
# machine + Brain adapter + injected Fute settings. Proves PASS / p0=0 / footer
# `0. menu` / official payment options / saved address / order-and-Pix only after
# confirmation — with noSend / noEvolution / noOrder / noPix / runtimeTouched=false.
# Manual only (workflow_dispatch). Uses CRON_SECRET — NOT ADMIN_SECRET.
# ─────────────────────────────────────────────────────────────────────────────

name: WhatsApp Text Order Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    name: "Text Order Diagnostic"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build URL
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="${{ secrets.QUALITY_AUDIT_URL }}"; fi
          BASE_URL="${BASE_URL%/}"
          echo "diag=${BASE_URL}/api/cron/whatsapp/text-order-diagnostic" >> "$GITHUB_OUTPUT"

      - name: "Run diagnostic"
        env:
          URL: ${{ steps.params.outputs.diag }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +e
          curl --connect-timeout 20 --max-time 180 -sS -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d '{}' \
            -o /tmp/diag.json -w "%{http_code}" > /tmp/dcode.txt
          set -e
          HTTP=$(cat /tmp/dcode.txt)
          STATUS=$(jq -r '.status' /tmp/diag.json 2>/dev/null)
          RUNTIME_TOUCHED=$(jq -r '.runtimeTouched' /tmp/diag.json 2>/dev/null)
          echo "← HTTP                          : $HTTP"
          echo "← status                        : $STATUS"
          echo "← passed/total                  : $(jq -r '.passed' /tmp/diag.json)/$(jq -r '.total' /tmp/diag.json)"
          echo "← p0                            : $(jq -r '.p0' /tmp/diag.json)"
          echo "← runtimeMetadataInjected       : $(jq -r '.runtimeMetadataInjected' /tmp/diag.json)"
          echo "← paymentOptionsFromFute        : $(jq -r '.paymentOptionsFromFute' /tmp/diag.json)"
          echo "← savedAddressLoaded            : $(jq -r '.savedAddressLoaded' /tmp/diag.json)"
          echo "← replyOnlyNoOrder              : $(jq -r '.replyOnlyNoOrder' /tmp/diag.json)"
          echo "← fullTestOrderOnlyAfterConfirm : $(jq -r '.fullTestOrderOnlyAfterConfirmation' /tmp/diag.json)"
          echo "← pixOnlyAfterConfirmation      : $(jq -r '.pixOnlyAfterConfirmation' /tmp/diag.json)"
          echo "← noSend/noEvolution/noOrder/noPix: $(jq -r '.noSend' /tmp/diag.json)/$(jq -r '.noEvolution' /tmp/diag.json)/$(jq -r '.noOrder' /tmp/diag.json)/$(jq -r '.noPix' /tmp/diag.json)"
          echo "← runtimeTouched                : $RUNTIME_TOUCHED"
          echo "── casos ──"
          jq -r '.cases[]? | "\(if .pass then "✓" else "✗" end) \(.name)\(if .pass then "" else " — " + .note end)"' /tmp/diag.json 2>/dev/null || true
          if [[ "$HTTP" -lt 200 || "$HTTP" -ge 300 ]]; then echo "::error::diagnostic non-2xx ($HTTP)."; exit 1; fi
          if [[ "$STATUS" != "PASS" ]]; then echo "::error::diagnostic status=$STATUS"; exit 1; fi
          if [[ "$RUNTIME_TOUCHED" != "false" ]]; then echo "::error::runtimeTouched must be false"; exit 1; fi
          echo "✅ Diagnóstico do anotador de pedido: PASS — nada enviado, nenhum pedido/Pix criado."
