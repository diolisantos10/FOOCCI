# ─────────────────────────────────────────────────────────────────────────────
# CRM Campaign Failure Diagnostic (read-only, manual)
#
# Aggregates a campaign's failed executions for a given provider HTTP status
# (default 400) to reveal the EXACT cause before any retry. Read-only: sends no
# WhatsApp, mutates nothing. Phones are masked; provider bodies grouped/truncated.
#
# Manual only. Uses CRON_SECRET.
# ─────────────────────────────────────────────────────────────────────────────

name: CRM Campaign Failure Diagnostic

on:
  workflow_dispatch:
    inputs:
      restaurant_slug:
        description: "Restaurant slug"
        required: true
        default: "sushi-cazza"
      campaign_name:
        description: "Campaign name (substring, case-insensitive)"
        required: true
        default: "Pedido de avaliação"
      status:
        description: "Provider HTTP status to inspect"
        required: false
        default: "400"

jobs:
  run:
    name: "CRM Campaign Failure Diagnostic"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build endpoint URL
        id: params
        run: |
          BASE_URL="${{ secrets.FOOCCI_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then BASE_URL="${{ secrets.QUALITY_AUDIT_URL }}"; fi
          BASE_URL="${BASE_URL%/}"
          echo "url=${BASE_URL}/api/cron/crm/campaign-failure-diagnostic" >> "$GITHUB_OUTPUT"

      - name: "POST campaign-failure-diagnostic"
        env:
          ENDPOINT_URL: ${{ steps.params.outputs.url }}
          CRON_SECRET:  ${{ secrets.CRON_SECRET }}
          SLUG:    ${{ github.event.inputs.restaurant_slug }}
          CAMPAIGN: ${{ github.event.inputs.campaign_name }}
          STATUS:  ${{ github.event.inputs.status }}
        run: |
          BODY=$(jq -nc --arg slug "$SLUG" --arg name "$CAMPAIGN" --arg status "$STATUS" \
            '{restaurantSlug:$slug, campaignName:$name, status:$status}')
          curl --connect-timeout 20 --max-time 120 -sS -X POST "$ENDPOINT_URL" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d "$BODY" -o /tmp/r.json -w "%{http_code}" > /tmp/code.txt || true
          echo "← HTTP        : $(cat /tmp/code.txt)"
          echo "← campaign    : $(jq -r '.campaign.name // "-"' /tmp/r.json) ($(jq -r '.campaign.id // "-"' /tmp/r.json))"
          echo "← status/total: $(jq -r '.status // "-"' /tmp/r.json) / $(jq -r '.total // "-"' /tmp/r.json)"
          echo "← provider    : $(jq -r '.provider.endpoint // "-"' /tmp/r.json) | payload $(jq -rc '.provider.payloadShape // "-"' /tmp/r.json)"
          echo "← instance    : name=$(jq -r '.instance.name' /tmp/r.json) state=$(jq -r '.instance.state' /tmp/r.json) connected=$(jq -r '.instance.connected' /tmp/r.json) checkError=$(jq -r '.instance.checkError // "-"' /tmp/r.json)"
          echo "← message     : empty=$(jq -r '.message.empty' /tmp/r.json) length=$(jq -r '.message.length // 0' /tmp/r.json)"
          echo "← phones      : valid=$(jq -r '.phones.valid' /tmp/r.json) invalid=$(jq -r '.phones.invalid' /tmp/r.json) missing=$(jq -r '.phones.missing' /tmp/r.json) distinct=$(jq -r '.phones.distinct' /tmp/r.json) duplicates=$(jq -r '.phones.duplicates' /tmp/r.json)"
          echo "← recoverable : $(jq -r '.classification.recoverableCount' /tmp/r.json)"
          echo "← SAFE TO REPROCESS: $(jq -r '.safeToReprocess' /tmp/r.json)"
          echo "── classification byCategory ──";     jq -r '.classification.byCategory | to_entries[]? | "  \(.key): \(.value)"' /tmp/r.json
          echo "── classification byRetryability ──"; jq -r '.classification.byRetryability | to_entries[]? | "  \(.key): \(.value)"' /tmp/r.json
          echo "── sub-reasons (provider body) ──"; jq -r '.subReasons | to_entries[]? | "  \(.key): \(.value)"' /tmp/r.json
          echo "── distinct provider bodies ──"; jq -r '.distinctBodies[]? | "  [\(.subReason)] x\(.count): \(.sample)"' /tmp/r.json
          echo "── samples (masked) ──"; jq -r '.samples[]? | "  raw=\(.rawMasked) norm=\(.normMasked) valid=\(.phoneValid) [\(.subReason) → \(.category) · \(.retryabilityLabel)] body=\(.bodySnippet)"' /tmp/r.json
          HTTP=$(cat /tmp/code.txt)
          if [[ "$HTTP" -lt 200 || "$HTTP" -ge 300 ]]; then echo "::error::non-2xx ($HTTP)"; jq . /tmp/r.json 2>/dev/null || cat /tmp/r.json; exit 1; fi
          echo "✅ Read-only diagnostic concluído — telefones mascarados, nada enviado."
