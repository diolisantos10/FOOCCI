# Force nixpacks to install devDependencies during the build phase.
# Without this, NODE_ENV=production causes npm ci to omit devDependencies,
# which breaks the Next.js build (eslint-config-next, typescript, etc.)
[phases.install]
cmds = ["npm ci --include=dev"]

# Emergency P3009 recovery — baked into image CMD so it cannot be overridden
# by Railway dashboard settings. Remove this [start] block after confirmed stable.
[start]
cmd = "echo 'FOOCCI EMERGENCY MIGRATION RECOVERY START' && npx prisma migrate resolve --rolled-back 20260518000001_add_distance_min_fee_km || true && npx prisma migrate deploy && npx next start"
